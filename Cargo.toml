[package]
name = "cyberpup-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Core Discord & Voice ---
poise = "0.7"
serenity = { version = "0.12", default-features = false, features = ["builder", "gateway", "client", "model", "cache", "collector", "utils", "rustls_backend"] }
songbird = { git = "https://github.com/serenity-rs/songbird", branch = "current", features = ["builtin-queue"] }

# --- Async & Runtime ---
tokio = {version = "1.0", features = ["macros", "rt-multi-thread", "fs", "time", "sync", "signal"]}
dotenvy = "0.15"

# --- Web & Networking ---
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# --- Utilities for Common Cog Features ---
chrono = { version = "0.4", features = ["serde"] }  # Dates, times, reminders, cooldown tracking
rand = "0.8"                                          # RNG, dice rolls, giveaways, random responses
regex = "1.10"                                        # Automod word filters, link parsing, custom patterns
tracing = "0.1"                                       # Structured event logging
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] } # SQLite database storage
futures = "0.3"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "chrono", "line_series", "ttf"] }

[profile.release]
strip = "symbols"
lto = false
codegen-units = 16